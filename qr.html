<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スマホ接続用 QRコード - 即日カードローン比較LP</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 30px 24px;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 20px;
      margin-bottom: 6px;
      color: #38bdf8;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .qr-box {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      display: inline-block;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }
    .qr-box img {
      display: block;
      width: 220px;
      height: 220px;
    }
    .url-badge {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-family: monospace;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 16px;
    }
    .step-list {
      text-align: left;
      background: #0f172a;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 16px;
    }
    .step-list li {
      margin-bottom: 6px;
    }
    .step-list li:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 スマホで開く（QRコード）</h1>
    <p>スマホの標準カメラで下のQRコードを読み取るだけで、<br>どこからでもサイトを表示して画面収録できます！</p>
    
    <div class="qr-box">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://akiyama0421.github.io/cardloan-sample-lp/" alt="QRコード">
    </div>

    <div class="url-badge">
      https://akiyama0421.github.io/cardloan-sample-lp/
    </div>

    <ul class="step-list">
      <li>① スマホのカメラで上記QRコードをスキャン</li>
      <li>② SafariやChromeでページが開きます</li>
      <li>③ スマホの「画面収録」を開始してデモ撮影スタート！</li>
    </ul>

    <div style="font-size: 11px; color: #64748b;">
      ※ GitHub Pagesで世界中に安全に公開済み（HTTPS暗号化）
    </div>
  </div>
</body>
</html>
